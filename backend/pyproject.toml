[project]
name = "padel-discovery-backend"
version = "0.1.0"
description = "Padel Discovery AI MVP backend"
requires-python = ">=3.12"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "padel_discovery.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
